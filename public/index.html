<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retium Wallet Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="crumbs">Home &gt; Check your wallet</span>
  </header>

  <main>
    <section class="check-card">
      <h1>Check Your Wallet</h1>

      <label class="field-label" for="project-select">Project</label>
      <div class="select-wrap">
        <span class="chain-dot"></span>
        <select id="project-select" disabled>
          <option>Retium</option>
        </select>
      </div>

      <p class="field-label">Choose the number of wallets to be found</p>

      <div class="mode-panel">
        <div class="mode-toggle" role="tablist">
          <button type="button" class="mode-btn active" data-mode="one" role="tab" aria-selected="true">One</button>
          <button type="button" class="mode-btn" data-mode="multiple" role="tab" aria-selected="false">Multiple</button>
        </div>

        <input
          id="address-input"
          type="text"
          placeholder="Enter your wallet address"
          autocomplete="off"
          spellcheck="false"
        />

        <textarea
          id="address-textarea"
          placeholder="Enter one wallet address per line"
          rows="4"
          hidden
        ></textarea>

        <button id="check-btn" type="button" class="check-btn">
          Check address
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </section>

    <div id="status"></div>
    <section id="result" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
